name: Match original car drawings with existing models
on:
  push:
    branches: [main]
    paths:
      - '.import/hd-candidates/**'
      - 'tools/paint-cars/match-originals.py'
      - '.github/workflows/match-originals.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow numpy
      - run: python tools/paint-cars/match-originals.py
      - name: Commit verified source-art match report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/garage-evolution/painted/original-match-report.json games/garage-evolution/painted/ORIGINAL-MATCHES.md
          if ! git diff --cached --quiet; then
            git commit -m "Audit exact original artwork matches for remaining low-resolution cars"
            git push origin HEAD:main
          fi