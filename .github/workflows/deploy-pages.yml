name: Publish playable Garage Evolution
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'index.html'
      - 'game.js'
      - 'games/garage-evolution/painted/**'
      - 'tools/paint-cars/rebuild-factory-body.py'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: garage-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-art processing dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Restore genuine factory arches from original PNGs
        run: python tools/paint-cars/rebuild-factory-body.py
      - name: Store recovered body WebPs in GitHub
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- games/garage-evolution/painted; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add games/garage-evolution/painted/*.webp
            git commit -m "Restore native factory arches across the 62 HD vehicle textures"
            git push origin HEAD:main
          fi
      - name: Verify and prepare playable website
        shell: bash
        run: |
          set -euo pipefail
          node --check game.js
          test -f index.html
          test -f games/garage-evolution/painted/aero.webp
          mkdir -p _site/games/garage-evolution
          cp index.html game.js _site/
          cp -a games/garage-evolution/painted _site/games/garage-evolution/
          touch _site/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          root = Path('_site')
          assets = list((root / 'games/garage-evolution/painted').glob('*.webp'))
          assert len(assets) >= 200, f'Missing active HD vehicle images: {len(assets)}'
          index = (root / 'index.html').read_text()
          js = (root / 'game.js').read_text()
          assert 'src="game.js"' in index
          assert 'games/garage-evolution/painted/' in js
          print(f'Validated {len(assets)} car sprites and playable game runtime')
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
