name: Integrate exact original car matches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-original-matches.yml'
      - 'tools/paint-cars/import-matched-originals.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: garage-exact-original-import
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing
        run: python -m pip install --quiet pillow numpy
      - name: Import 13 confirmed original car illustrations
        run: python tools/paint-cars/import-matched-originals.py
      - name: Check build and existing artwork
        run: |
          node --check game.js
          python tools/paint-cars/verify-import.py
      - name: Commit the newly imported full-resolution sprites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js games/garage-evolution/painted/meta.json games/garage-evolution/painted/meta.ts
          git add games/garage-evolution/painted/originals/*.png games/garage-evolution/painted/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Replace 13 additional small cars with exact original HD artwork"
            git push origin HEAD:main
          fi
      - name: Publish updated art and test the game
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --ref main
          gh workflow run browser-smoke.yml --ref main
