name: Polish original wheel cutouts
on:
  push:
    branches: [main]
    paths:
      - 'tools/paint-cars/polish-factory-wheels.py'
      - '.github/workflows/polish-factory-wheels.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: garage-wheel-polish
  cancel-in-progress: true
jobs:
  wheel-art:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow numpy
      - name: Restore circular tyres and centre their real hubs
        run: python tools/paint-cars/polish-factory-wheels.py
      - name: Validate imports and game syntax
        run: |
          python tools/paint-cars/verify-import.py
          node --check game.js
      - name: Commit polished car-specific wheel sprites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/garage-evolution/painted/*-w*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Clean tyre cutouts and recenter factory rim hubs"
            git push origin HEAD:main
          fi
      - name: Publish and test updated images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --ref main
          gh workflow run browser-smoke.yml --ref main
