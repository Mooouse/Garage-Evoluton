name: Review remaining original car illustrations
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-originals.yml'
      - 'tools/paint-cars/review-originals.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contact-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow
      - run: python tools/paint-cars/review-originals.py
