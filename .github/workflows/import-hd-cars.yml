name: Import high-resolution Garage Evolution cars

on:
  push:
    branches: [main]
    paths:
      - 'games/garage-evolution/painted/originals/*.png'
      - 'tools/paint-cars/import-user-originals.py'
      - '.github/workflows/import-hd-cars.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: garage-original-art
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing dependencies
        run: python -m pip install --quiet Pillow numpy
      - name: Convert the original full-resolution PNGs into game sprites
        run: python tools/paint-cars/import-user-originals.py
      - name: Verify sprite geometry and deployed game syntax
        shell: bash
        run: |
          python tools/paint-cars/verify-import.py
          node --check game.js
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          p = Path('games/garage-evolution/painted')
          meta = json.loads((p / 'meta.json').read_text())
          models = ['longnose','scissor','storm','zephyrus','viola','tempest','trackwing','carboncrown']
          for mid in models:
              data = meta[mid]
              assert data['img']['w'] >= 1500, (mid, 'degraded HD body')
              assert len(data['wheels']) == 2, (mid, 'missing separate wheel')
              with Image.open(p / f'{mid}.webp') as car:
                  assert car.size == (data['img']['w'], data['img']['h']), mid
                  body = car.convert('RGBA')
              for i, wheel in enumerate(data['wheels']):
                  cx = round(wheel['x'] * data['img']['w'])
                  cy = round((data['height'] - wheel['r'] - wheel['lift']) * data['img']['w'])
                  assert body.getpixel((cx, cy))[3] == 0, (mid, i, 'wheel not separated')
                  with Image.open(p / f'{mid}-w{i}.webp') as wh:
                      assert wh.width >= 150 and wh.height >= 150, (mid, i)
              print('HD artwork ready:', mid)
          PY
      - name: Commit integrated artwork and game metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js games/garage-evolution/painted/meta.json games/garage-evolution/painted/meta.ts
          git add games/garage-evolution/painted/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Integrate original HD vehicle artwork and accurately separated wheels"
            git push origin HEAD:main
          fi
      # GITHUB_TOKEN pushes do not trigger ordinary push workflows.
      # Dispatch guarantees the generated version reaches Pages and smoke tests.
      - name: Publish and browser-test the newly generated textures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --ref main
          gh workflow run browser-smoke.yml --ref main