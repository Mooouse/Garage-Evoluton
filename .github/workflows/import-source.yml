name: Import Garage Evolution source
on:
  push:
    paths:
      - '.import/garage-source.part*'
      - '.github/workflows/import-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract the project
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          parts = sorted(Path('.import').glob('garage-source.part*'))
          if len(parts) != 10:
              raise RuntimeError(f'Expected 10 source parts; found {len(parts)}')
          archive = Path('/tmp/garage-source.zip')
          with archive.open('wb') as output:
              for part in parts:
                  output.write(part.read_bytes())
          expected = '2d2c1c6617e4ac6f171add582d6a9b3e82bc31b2359d169fc667782dd22fa4ed'
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != expected:
              raise RuntimeError(f'Archive checksum mismatch: {actual}')
          root = Path.cwd().resolve()
          written = 0
          with ZipFile(archive) as z:
              for entry in z.infolist():
                  if entry.is_dir():
                      continue
                  name = entry.filename
                  prefix = 'game19-master/'
                  if not name.startswith(prefix):
                      raise RuntimeError('Unexpected entry: ' + name)
                  relative = PurePosixPath(name[len(prefix):])
                  if not relative.parts or '..' in relative.parts or relative.is_absolute():
                      raise RuntimeError('Unsafe entry: ' + name)
                  target = (root / str(relative)).resolve()
                  if not target.is_relative_to(root):
                      raise RuntimeError('Unsafe destination: ' + name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(entry))
                  written += 1
          print(f'Imported {written} project files from verified archive')
          PY
      - name: Commit full source and remove transfer parts
        shell: bash
        run: |
          rm -rf .import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import Garage Evolution repaired source and car assets"
            git push origin HEAD:main
          fi
