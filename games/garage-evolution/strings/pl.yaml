listing:
  description: "Idle Garage Evolution to inkrementalny clicker o renowacji: rozbite auta trafiają do twojego garażu, a ty przywracasz je do życia własnymi rękami. Zeszoruj błoto, zeszlifuj ukrytą pod nim rdzę, nałóż świeży lakier, wypoleruj rysy, przykręć nowe części i odpal silnik — każda warstwa znika dokładnie tam, gdzie dotykasz, a gotowe auto mruga światłami i wyjeżdża ODNOWIONE. Kupuj lepsze narzędzia i roboty, które widzisz przy pracy obok siebie, rozbuduj ciasną szopę w warsztat, stację serwisową, luksusowy salon i zakład przemysłowy, i zbieraj 142 pojazdów we wszystkich wersjach i rzadkościach — od starych hatchbacków po hipersamochody, ciężkie maszyny i pierwsze statki kosmiczne.\n\n- Satysfakcjonująca renowacja warstwa po warstwie: błoto, kurz, sadza, rdza, lakier, polerka, części, silnik\n- Narzędzie dopasowuje się do powierzchni: szczotka, szlifierka, pistolet lakierniczy, polerka, klucz\n- Widoczna automatyzacja: roboty pracują same, także gdy cię nie ma\n- 23 garaże na interaktywnej mapie: miasta na całym świecie, potem Księżyc i planety ze statkami do naprawy\n- Album kolekcji z wersjami i rzadkościami, rzadkie auto dnia i pełne statystyki"
  controls: "Mysz: kliknij lub przeciągnij po aucie, by nad nim pracować · Dotyk: stuknij lub przesuń po aucie · Klawiatura: P pauzuje · Mapa: przeciągnij, by przesunąć, uszczypnij lub kółko, by przybliżyć, stuknij garaż"

