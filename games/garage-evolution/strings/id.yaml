listing:
  description: "Idle Garage Evolution adalah clicker restorasi inkremental: mobil rongsok masuk ke garasi Anda dan Anda menghidupkannya kembali dengan tangan sendiri. Gosok lumpurnya, gerinda karat yang tersembunyi di baliknya, semprotkan cat baru, poles goresannya, pasang suku cadang baru, dan nyalakan mesinnya — setiap lapisan hilang tepat di tempat yang Anda sentuh, lalu mobil yang selesai menyalakan lampunya dan keluar DIPULIHKAN. Beli alat yang lebih baik dan robot yang terlihat bekerja di samping Anda, kembangkan gudang sempit menjadi bengkel, stasiun servis, showroom mewah, dan pabrik industri, serta kumpulkan 142 kendaraan dalam setiap varian dan kelangkaan — dari hatchback tua hingga hypercar, alat berat, dan pesawat antariksa pertama.\n\n- Restorasi lapis demi lapis yang memuaskan: lumpur, debu, jelaga, karat, cat, poles, suku cadang, mesin\n- Alat menyesuaikan permukaan: sikat, gerinda, spray gun, mesin poles, kunci\n- Otomatisasi yang terlihat: robot bekerja sendiri, juga saat Anda pergi\n- 23 garasi di peta interaktif: kota-kota di seluruh dunia, lalu Bulan dan planet-planet, dengan pesawat antariksa untuk diperbaiki\n- Album koleksi dengan varian dan kelangkaan, mobil langka harian, dan statistik lengkap"
  controls: "Mouse: klik atau seret di atas mobil untuk mengerjakannya · Sentuh: ketuk atau usap di atas mobil · Keyboard: P untuk jeda · Peta: seret untuk menggeser, cubit atau gulir untuk zoom, ketuk garasi"

