listing:
  description: "Idle Garage Evolution es un clicker incremental de restauración: coches destrozados llegan a tu garaje y tú les devuelves la vida con tus propias manos. Quita el barro, lija el óxido que se esconde debajo, pinta, pule los arañazos, monta piezas nuevas y arranca el motor: cada capa desaparece justo donde tocas, y el coche terminado da las luces y sale RESTAURADO. Compra mejores herramientas y robots que ves trabajar a tu lado, convierte un cobertizo estrecho en un taller, una estación de servicio, una sala de exposición de lujo y una planta industrial, y colecciona 142 vehículos en todas sus versiones y rarezas: desde viejos compactos hasta hiperdeportivos, máquinas pesadas y las primeras naves espaciales.\n\n- Restauración satisfactoria capa a capa: barro, polvo, hollín, óxido, pintura, pulido, piezas, motor\n- La herramienta se adapta a la superficie: cepillo, amoladora, pistola de pintura, pulidora, llave\n- Automatización visible: robots que trabajan solos, también cuando no estás\n- 23 garajes en un mapa interactivo: ciudades de todo el mundo, luego la Luna y los planetas, con naves que reparar\n- Un álbum de colección con versiones y rarezas, un coche raro del día y estadísticas completas"
  controls: "Ratón: haz clic o arrastra sobre el coche para trabajar · Táctil: toca o desliza sobre el coche · Teclado: P pausa · Mapa: arrastra para moverte, pellizca o usa la rueda para el zoom, toca un garaje"

