listing:
  description: "Idle Garage Evolution è un clicker incrementale di restauro: auto distrutte arrivano nel tuo garage e tu le riporti in vita con le tue mani. Togli il fango, smeriglia la ruggine nascosta sotto, spruzza vernice fresca, lucida via i graffi, monta pezzi nuovi e avvia il motore: ogni strato sparisce esattamente dove tocchi, e l'auto finita lampeggia con i fari ed esce RESTAURATA. Compra attrezzi migliori e robot che vedi lavorare accanto a te, trasforma un capanno angusto in un'officina, una stazione di servizio, uno showroom di lusso e un impianto industriale, e colleziona 142 veicoli in ogni variante e rarità: dalle vecchie utilitarie alle hypercar, dalle macchine pesanti alle prime astronavi.\n\n- Restauro appagante strato dopo strato: fango, polvere, fuliggine, ruggine, vernice, lucidatura, pezzi, motore\n- L'attrezzo segue la superficie: spazzola, smerigliatrice, pistola a spruzzo, lucidatrice, chiave\n- Automazione visibile: robot che lavorano da soli, anche quando sei via\n- 23 garage su una mappa interattiva: città di tutto il mondo, poi la Luna e i pianeti, con astronavi da riparare\n- Un album da collezione con varianti e rarità, un'auto rara del giorno e statistiche complete"
  controls: "Mouse: clicca o trascina sull'auto per lavorarci · Touch: tocca o scorri sull'auto · Tastiera: P mette in pausa · Mappa: trascina per spostarti, pizzica o usa la rotella per lo zoom, tocca un garage"

