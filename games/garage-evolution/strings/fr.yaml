listing:
  description: "Idle Garage Evolution est un clicker incrémental de restauration : des voitures en ruine arrivent dans votre garage et vous leur redonnez vie de vos propres mains. Frottez la boue, poncez la rouille cachée dessous, appliquez une peinture neuve, polissez les rayures, montez des pièces neuves et démarrez le moteur — chaque couche disparaît exactement là où vous touchez, et la voiture terminée fait un appel de phares avant de sortir RESTAURÉE. Achetez de meilleurs outils et des robots que vous voyez travailler à vos côtés, transformez un cabanon exigu en atelier, station-service, showroom de luxe et usine, et collectionnez 142 véhicules dans toutes leurs versions et raretés — des vieilles citadines aux hypercars, en passant par les engins lourds et les premiers vaisseaux spatiaux.\n\n- Une restauration satisfaisante couche par couche : boue, poussière, suie, rouille, peinture, polissage, pièces, moteur\n- L'outil suit la surface : brosse, meuleuse, pistolet à peinture, polisseuse, clé\n- Une automatisation visible : des robots qui travaillent seuls, même en votre absence\n- 23 garages sur une carte interactive : des villes du monde entier, puis la Lune et les planètes, avec des vaisseaux à réparer\n- Un album de collection avec versions et raretés, une voiture rare du jour et des statistiques complètes"
  controls: "Souris : cliquez ou glissez sur la voiture pour la travailler · Tactile : touchez ou balayez la voiture · Clavier : P met en pause · Carte : glissez pour la déplacer, pincez ou molette pour zoomer, touchez un garage"

