listing:
  description: "Idle Garage Evolution ist ein Inkrementell-Clicker rund ums Restaurieren: Schrottautos rollen in deine Garage und du erweckst sie mit deinen eigenen Händen wieder zum Leben. Schrubb den Schlamm ab, schleif den darunter versteckten Rost weg, sprüh frischen Lack auf, polier die Kratzer raus, schraub neue Teile an und starte den Motor – jede Schicht verschwindet genau dort, wo du sie berührst, und das fertige Auto blinkt mit den Scheinwerfern und rollt RESTAURIERT hinaus. Kauf besseres Werkzeug und Roboter, die du neben dir arbeiten siehst, mach aus einem engen Schuppen eine Werkstatt, eine Servicestation, einen Luxus-Showroom und ein Industriewerk und sammle 142 Fahrzeuge in allen Varianten und Seltenheiten – von alten Kleinwagen über Hypercars und schwere Maschinen bis zu den ersten Raumschiffen.\n\n- Befriedigendes Restaurieren Schicht für Schicht: Schlamm, Staub, Ruß, Rost, Lack, Politur, Teile, Motor\n- Das Werkzeug passt sich der Oberfläche an: Bürste, Schleifer, Lackierpistole, Polierer, Schlüssel\n- Sichtbare Automatisierung: Roboter arbeiten allein, auch wenn du weg bist\n- 23 Garagen auf einer interaktiven Karte: Städte rund um die Welt, dann der Mond und die Planeten mit Raumschiffen zum Reparieren\n- Ein Sammelalbum mit Varianten und Seltenheiten, ein seltenes Auto des Tages und ausführliche Statistiken"
  controls: "Maus: Klicke oder ziehe über das Auto, um es zu bearbeiten · Touch: Tippe oder wische über das Auto · Tastatur: P pausiert · Karte: ziehen zum Verschieben, Pinch oder Mausrad zum Zoomen, Garage antippen"

