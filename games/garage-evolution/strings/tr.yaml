listing:
  description: "Idle Garage Evolution, artımlı bir restorasyon tıklama oyunudur: hurda arabalar garajınıza gelir ve siz onları kendi ellerinizle yeniden hayata döndürürsünüz. Çamuru ovarak temizleyin, altına saklanmış pası zımparalayın, taze boya püskürtün, çizikleri cilalayın, yeni parçaları takın ve motoru çalıştırın — her katman tam dokunduğunuz yerde kaybolur, biten araba farlarını yakıp söndürür ve YENİLENDİ olarak dışarı çıkar. Yanınızda çalıştığını gördüğünüz daha iyi aletler ve robotlar satın alın, dar bir barakayı atölyeye, servis istasyonuna, lüks bir showroom'a ve sanayi tesisine dönüştürün ve 142 aracı her sürüm ve nadirlikte toplayın — eski hatchback'lerden hiper arabalara, iş makinelerine ve ilk uzay gemilerine kadar.\n\n- Katman katman tatmin edici restorasyon: çamur, toz, is, pas, boya, cila, parçalar, motor\n- Alet yüzeye göre değişir: fırça, taşlama, boya tabancası, cila makinesi, anahtar\n- Görünür otomasyon: siz yokken de kendi kendine çalışan robotlar\n- Etkileşimli haritada 23 garaj: dünyanın dört bir yanındaki şehirler, sonra Ay ve gezegenler, onarılacak uzay gemileriyle\n- Sürümler ve nadirliklerle bir koleksiyon albümü, günün nadir aracı ve ayrıntılı istatistikler"
  controls: "Fare: üzerinde çalışmak için arabaya tıklayın veya sürükleyin · Dokunmatik: arabaya dokunun veya kaydırın · Klavye: P duraklatır · Harita: kaydırmak için sürükleyin, yakınlaştırmak için sıkıştırın veya tekerleği kullanın, bir garaja dokunun"

