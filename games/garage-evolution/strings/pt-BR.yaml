listing:
  description: "Idle Garage Evolution é um clicker incremental de restauração: carros destruídos chegam à sua garagem e você os traz de volta à vida com as próprias mãos. Esfregue a lama, lixe a ferrugem escondida embaixo dela, aplique tinta nova, tire os arranhões no polimento, encaixe peças novas e dê a partida no motor — cada camada some exatamente onde você toca, e o carro pronto pisca os faróis e sai RESTAURADO. Compre ferramentas melhores e robôs que você vê trabalhando ao seu lado, transforme um barracão apertado em oficina, posto de serviço, showroom de luxo e planta industrial, e colecione 142 veículos em todas as versões e raridades — de hatches antigos a hipercarros, máquinas pesadas e as primeiras naves espaciais.\n\n- Restauração satisfatória camada por camada: lama, poeira, fuligem, ferrugem, pintura, polimento, peças, motor\n- A ferramenta acompanha a superfície: escova, esmerilhadeira, pistola de pintura, politriz, chave\n- Automação visível: robôs que trabalham sozinhos, mesmo quando você está fora\n- 23 garagens em um mapa interativo: cidades do mundo todo, depois a Lua e os planetas, com naves para consertar\n- Um álbum de coleção com versões e raridades, um carro raro do dia e estatísticas completas"
  controls: "Mouse: clique ou arraste sobre o carro para trabalhar · Toque: toque ou deslize sobre o carro · Teclado: P pausa · Mapa: arraste para mover, pinça ou roda para zoom, toque numa garagem"

