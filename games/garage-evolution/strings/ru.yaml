listing:
  description: "Idle Garage Evolution — инкрементальный кликер о реставрации: разбитые машины заезжают в ваш гараж, и вы своими руками возвращаете их к жизни. Отмойте грязь, сошлифуйте спрятанную под ней ржавчину, нанесите свежую краску, отполируйте царапины, поставьте новые детали и заведите мотор — каждый слой исчезает ровно там, где вы касаетесь, а готовая машина мигает фарами и уезжает с надписью ВОССТАНОВЛЕНО. Покупайте инструменты получше и роботов, которые работают у вас на глазах, превратите тесный сарай в мастерскую, автосервис, элитный салон и завод и соберите 142 машины во всех версиях и редкостях — от старых хэтчбеков до гиперкаров, тяжёлой техники и первых космических кораблей.\n\n- Приятная послойная реставрация: грязь, пыль, копоть, ржавчина, покраска, полировка, детали, мотор\n- Инструмент меняется под поверхность: щётка, болгарка, краскопульт, полировалка, ключ\n- Видимая автоматизация: роботы работают сами, даже когда вас нет\n- 23 гаража на интерактивной карте: города по всему миру, потом Луна и планеты, где чинят космические корабли\n- Альбом коллекции с версиями и редкостями, редкая машина дня и подробная статистика"
  controls: "Мышь: щёлкните или ведите по машине, чтобы работать · Сенсор: нажимайте или проводите по машине · Клавиатура: P — пауза · Карта: тяните, чтобы двигать, щипок или колесо — масштаб, нажмите на гараж"

